<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מצא בזול</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside id="filters" aria-label="סינון"></aside>
    <div class="main">
      <header class="top">
        <div>
          <h1>מצא בזול</h1>
          <p>כותבים, מסננים, או מעלים תמונה. התוצאות כוללות חנויות ואתרים.</p>
        </div>
      </header>
      <div id="thread" class="thread" aria-live="polite"></div>
      <form id="composer" class="composer">
        <div id="pending" class="pending" hidden></div>
        <label class="sr" for="query">הודעה</label>
        <textarea id="query" rows="2" placeholder="למשל: נעליים לשיעור ספורט, חדשות, ושלא ייקח שבוע"></textarea>
        <div class="composer-actions">
          <input id="photo" type="file" accept="image/*" hidden>
          <button id="photo-btn" type="button">תמונה</button>
          <button id="mic-btn" type="button">הקלטה</button>
          <button id="send-btn" type="submit">שלח</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
